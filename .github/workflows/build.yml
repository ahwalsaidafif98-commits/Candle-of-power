name: Build Candle of Power

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract source
        run: |
          unzip Candle-of-Power-source-1.0.0.zip -d source

      - name: Build mod
        working-directory: source/Candle-of-Power
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Candle-of-Power-1.0.0
          path: source/Candle-of-Power/build/libs/*.jar
